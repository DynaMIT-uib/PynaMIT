name: Test and publish documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  HOME: /tmp
  GIT_CONFIG_GLOBAL: /tmp/.gitconfig

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  quality:
    name: Code and documentation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-data-2026-08-06

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install PynaMIT
        run: pip install "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main" .

      - name: Check code
        run: |
          ruff check .
          ruff format --check src tests scripts

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs/source docs/build

      - name: Upload documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NumPy and input providers
            image: ghcr.io/dynamit-uib/pynamit:x86_64-data-2026-08-06
            pytest_args: >-
              --backend numpy
              --data-source fallback
              --data-source native
          - name: JAX
            image: ghcr.io/dynamit-uib/pynamit:x86_64-jax-2026-08-06
            pytest_args: >-
              --backend jax
              --data-source fallback
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install PynaMIT
        run: pip install "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main" .

      - name: Run tests
        run: pytest -q ${{ matrix.pytest_args }}

  package:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-data-2026-08-06

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and inspect distributions
        run: |
          pip install build twine "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main"
          python -m build
          python -m twine check dist/*

      - name: Test the wheel outside the source tree
        run: |
          python -m venv --system-site-packages /tmp/pynamit-wheel
          /tmp/pynamit-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/pynamit-wheel/bin/python -c "from importlib.resources import files; from pynamit import InputPreparation, Simulation; assert files('pynamit.data').joinpath('fallback_inputs.json').is_file()"

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, test, package]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-docs.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deploy-docs
        uses: actions/deploy-pages@v5

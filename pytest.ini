[pytest]
pythonpath = src ../kompe/src
testpaths = tests
markers =
    apexpy_precision: mark a numerical regression whose path executes ApexPy.
    native_hwm_precision: mark a regression that executes pyHWM for native inputs.
    requires_jax: mark test as requiring JAX to be installed.
    requires_native_inputs: mark test as requiring native input datasets.
    performance: mark performance regression tests.

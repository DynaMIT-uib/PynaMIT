name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Needed if your GHCR images are private
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [jax, data]
        date: ['2026-08-06']
    # Use one container per matrix run
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-${{ matrix.variant }}-${{ matrix.date }}
    env:
      HOME: /tmp
      GIT_CONFIG_GLOBAL: /tmp/.gitconfig
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: Check out PynaMIT repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install PynaMIT
        run: pip install "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main" .

      - name: Lint PynaMIT code
        run: ruff check

      - name: Build PynaMIT documentation
        run: sphinx-apidoc -o docs/source src && sphinx-build -b html docs/source docs/build

      - name: Compare native and fallback input pipelines
        if: matrix.variant == 'data'
        continue-on-error: true
        run: |
          python scripts/tools/compare_native_fallback_pipeline.py \
            --json native-fallback-pipeline.json

      - name: Run PynaMIT tests
        run: pytest -v

      - name: Upload native/fallback pipeline diagnostics
        if: always() && matrix.variant == 'data'
        uses: actions/upload-artifact@v4
        with:
          name: native-fallback-pipeline-${{ github.run_attempt }}
          path: native-fallback-pipeline.json
          if-no-files-found: warn

      # Upload docs from only one variant to avoid duplicate artifacts
      - name: Upload documentation artifact
        if: github.ref == 'refs/heads/main' && matrix.variant == 'jax'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-docs.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deploy-docs
        uses: actions/deploy-pages@v4

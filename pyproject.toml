[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pynamit"
dynamic = ["version"]
description = "Inductive magnetosphere-ionosphere-thermosphere coupling on a spherical shell"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PynaMIT Developers"}]
dependencies = [
    "apexpy",
    "dipole @ git+https://github.com/klaundal/dipole.git@main",
    "numpy>=2.0",
    "pandas",
    "ppigrf",
    "scipy",
    "kompe>=0.2.0",
    "xarray",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["geophysics", "ionosphere", "magnetosphere", "space physics"]

[project.urls]
Homepage = "https://github.com/DynaMIT-uib/PynaMIT"
Documentation = "https://dynamit-uib.github.io/PynaMIT/"
Issues = "https://github.com/DynaMIT-uib/PynaMIT/issues"
Repository = "https://github.com/DynaMIT-uib/PynaMIT.git"

[project.optional-dependencies]
jax = [
    "jax>=0.4.26",
]
plot = [
    "cartopy",
    "matplotlib",
    "pillow>=9.1",
    "polplot @ git+https://github.com/klaundal/polplot.git@main",
]
gui = [
    "cartopy",
    "h5py",
    "matplotlib",
    "netCDF4",
    "panel",
    "pillow>=9.1",
    "polplot @ git+https://github.com/klaundal/polplot.git@main",
    "zarr",
]
mage = [
    "h5py",
]
[project.scripts]
pynamit-gui = "pynamit.gui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynamit = ["data/*.json"]

[tool.setuptools_scm]

[tool.ruff]
src = ["src", "tests", "scripts"]
extend-exclude = ["__init__.py", "notebooks/", "scripts/simulation/legacy/"]
line-length = 99

[tool.ruff.lint]
# Keep the historical rule set explicit. Broad one-letter selectors such as
# ``D`` and ``B`` also match newer, unrelated Ruff families (for example DTZ
# and BLE), which makes a Ruff upgrade silently change the project's policy.
select = [
    "E4", "E7", "E9", "F",
    "B0", "B9",
    "I001", "I002",
    "UP", "W",
    "D1", "D2", "D3", "D4",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

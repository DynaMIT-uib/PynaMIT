[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "pynamit"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "apexpy",
    "dipole @ git+https://github.com/klaundal/dipole.git@main",
    "numpy>=2.0",
    "packaging",
    "pandas",
    "ppigrf",
    "scipy",
    "kompe>=0.2.0",
    "xarray",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.26",
]
plot = [
    "cartopy",
    "matplotlib",
    "pillow",
    "polplot @ git+https://github.com/klaundal/polplot.git@main",
]
gui = [
    "cartopy",
    "h5py",
    "matplotlib",
    "netCDF4",
    "panel",
    "pillow",
    "polplot @ git+https://github.com/klaundal/polplot.git@main",
    "zarr",
]
mage = [
    "h5py",
]
inputs = [
    "lompe @ git+https://github.com/klaundal/lompe.git@main",
    "pyamps",
    "pyhwm2014 @ git+https://github.com/rilma/pyHWM14.git@main",
]

[project.scripts]
pynamit-gui = "pynamit.gui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff]
src = ["src", "tests", "scripts"]
extend-exclude = ["__init__.py", "notebooks/", "scripts/simulation/legacy/"]
line-length = 99

[tool.ruff.lint]
# Keep the historical rule set explicit. Broad one-letter selectors such as
# ``D`` and ``B`` also match newer, unrelated Ruff families (for example DTZ
# and BLE), which makes a Ruff upgrade silently change the project's policy.
select = [
    "E4", "E7", "E9", "F",
    "B0", "B9",
    "I001", "I002",
    "UP", "W",
    "D1", "D2", "D3", "D4",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

name: Test and publish documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  HOME: /tmp
  GIT_CONFIG_GLOBAL: /tmp/.gitconfig

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  quality:
    name: Code and documentation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-jax-2026-08-23

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install current Kompe
        run: |
          python -m pip install --no-cache-dir --no-deps \
            "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main"
          python -c "from kompe.math import get_backend; print('Kompe backend:', get_backend())"

      - name: Install PynaMIT
        run: python -m pip install .

      - name: Check code
        run: |
          ruff check .
          ruff format --check src tests scripts

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs/source docs/build

      - name: Upload documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  test:
    name: NumPy and JAX with fallback inputs
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-jax-2026-08-23

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install current Kompe
        run: |
          python -m pip install --no-cache-dir --no-deps \
            "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main"
          python -c "from kompe.math import get_backend; print('Kompe backend:', get_backend())"

      - name: Install PynaMIT
        run: python -m pip install .

      - name: Verify native input models are absent
        run: |
          python - <<'PY'
          from importlib.util import find_spec

          input_models = ("lompe", "pyamps", "pyhwm2014")
          installed = [name for name in input_models if find_spec(name)]
          assert not installed, f"Native input models baked into image: {installed}"
          PY

      - name: Run tests
        run: |
          pytest -q \
            --backend numpy \
            --backend jax \
            --data-source fallback

  native-inputs:
    name: Native input models
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-jax-2026-08-23

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install current Kompe
        run: |
          python -m pip install --no-cache-dir --no-deps \
            "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main"
          python -c "from kompe.math import get_backend; print('Kompe backend:', get_backend())"

      - name: Install PynaMIT and native input models
        run: |
          python -m pip install . -r requirements/pip-input-models.txt
          # pyHWM2014 currently declares a nonexistent ``timeutil`` dependency.
          python -m pip install --no-deps \
            "pyhwm2014 @ git+https://github.com/rilma/pyHWM14.git@main"

      - name: Verify native inputs are available
        run: |
          python -c "from pynamit.external_inputs import native_inputs_available; assert native_inputs_available()"

      - name: Run native-input tests
        run: |
          pytest -q \
            -m native_input_validation \
            --backend numpy \
            --backend jax \
            --data-source native

  package:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dynamit-uib/pynamit:x86_64-jax-2026-08-23

    steps:
      - name: Check out PynaMIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build tools and current Kompe
        run: |
          python -m pip install build twine
          python -m pip install --no-cache-dir --no-deps \
            "kompe @ git+https://github.com/DynaMIT-uib/kompe.git@main"
          python -c "from kompe.math import get_backend; print('Kompe backend:', get_backend())"

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test the wheel outside the source tree
        run: |
          python -m venv --system-site-packages /tmp/pynamit-wheel
          /tmp/pynamit-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/pynamit-wheel/bin/python -c "from importlib.resources import files; from pynamit import InputPreparation, Simulation; assert files('pynamit.data').joinpath('fallback_inputs.json').is_file()"

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, test, native-inputs, package]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-docs.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deploy-docs
        uses: actions/deploy-pages@v5
